<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Happy Birthday Aarav Patel</title>
<style>
  :root {
    --ink: #123a66;
    --gold: #f2a93b;
    --gold-deep: #a86a12;
    --sky: #eaf3fc;
    --slate: #5c6b84;
    --balloon: #6fa8dc;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px;
    background: var(--sky);
    display: flex;
    justify-content: center;
    font-family: system-ui, "Segoe UI", Roboto, sans-serif;
  }
  .card-wrap {
    width: min(420px, 92vw);
  }
  .card {
    position: relative;
    width: 100%;
    aspect-ratio: 853 / 1844;
    border-radius: 28px;
    overflow: hidden;
    background: linear-gradient(180deg, #eaf3fc 0%, #dcebfa 78%, #4f86c6 100%);
    box-shadow: 0 18px 40px rgba(18, 58, 102, 0.18);
  }
  .card .bg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: top center;
    display: block;
  }
  .content {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    height: 100%;
    padding: 230px 34px 20px;
    text-align: center;
  }
  .headline {
    line-height: 1;
  }
  .headline .script {
    display: block;
    font-family: "Segoe Script", "Bradley Hand", "Brush Script MT", cursive;
    font-size: 34px;
    color: var(--ink);
  }
  .headline .bold {
    display: block;
    margin-top: 4px;
    font-family: ui-rounded, "Segoe UI Semibold", "Century Gothic", sans-serif;
    font-weight: 800;
    font-size: 46px;
    letter-spacing: 0.5px;
    color: var(--gold);
    text-shadow: 0 2px 0 rgba(18, 58, 102, 0.12);
  }
  .photo-ring {
    margin-top: 18px;
    width: 150px;
    height: 150px;
    flex-shrink: 0;
    border-radius: 50%;
    background: linear-gradient(145deg, var(--balloon), var(--gold));
    padding: 6px;
    box-shadow: 0 6px 18px rgba(18, 58, 102, 0.22);
  }
  .photo-ring .photo {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    overflow: hidden;
    background: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .photo-ring .photo img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .photo-ring .photo .initials {
    font-family: ui-rounded, "Segoe UI Semibold", sans-serif;
    font-weight: 700;
    font-size: 48px;
    color: var(--ink);
  }
  .name {
    margin-top: 16px;
    font-family: ui-rounded, "Segoe UI Semibold", "Century Gothic", sans-serif;
    font-weight: 800;
    font-size: 28px;
    color: var(--ink);
  }
  .class-pill {
    margin-top: 10px;
    background: #ffffff;
    color: var(--ink);
    font-weight: 600;
    font-size: 14px;
    padding: 6px 20px;
    border-radius: 999px;
    box-shadow: 0 3px 8px rgba(18, 58, 102, 0.14);
    white-space: nowrap;
  }
  .ribbon {
    margin-top: 14px;
    background: linear-gradient(180deg, var(--gold), #e0921f);
    color: #ffffff;
    font-weight: 700;
    font-size: 15px;
    padding: 8px 24px;
    border-radius: 999px;
    box-shadow: 0 4px 10px rgba(168, 106, 18, 0.35);
    white-space: nowrap;
  }
  .message {
    margin: 16px 0 0;
    max-width: 300px;
    color: var(--slate);
    font-size: 15px;
    line-height: 1.6;
  }
  .divider {
    margin-top: 20px;
    width: 78%;
    display: flex;
    align-items: center;
    gap: 12px;
    color: var(--balloon);
  }
  .divider .line {
    flex: 1;
    height: 1px;
    background: rgba(111, 168, 220, 0.55);
  }
  .divider .heart {
    font-size: 18px;
    color: var(--balloon);
  }
  .stats {
    margin-top: auto;
    width: 100%;
    background: rgba(255, 255, 255, 0.92);
    border-radius: 20px;
    display: flex;
    align-items: center;
    padding: 16px 8px;
    box-shadow: 0 8px 20px rgba(18, 58, 102, 0.14);
  }
  .stats .stat {
    flex: 1;
    text-align: center;
    padding: 0 6px;
  }
  .stats .stat + .stat {
    border-left: 1px solid rgba(18, 58, 102, 0.12);
  }
  .stats .stat .icon {
    font-size: 20px;
    line-height: 1;
    margin-bottom: 6px;
  }
  .stats .stat .label {
    font-size: 11px;
    color: var(--slate);
    margin-bottom: 4px;
  }
  .stats .stat .value {
    font-size: 14px;
    font-weight: 700;
    color: var(--ink);
  }
</style>
</head>
<body>
  <div class="card-wrap">
    <div class="card">
      <img class="bg" src="https://dc-driver-documents.s3.ap-southeast-2.amazonaws.com/zd0009/f8cf4212-bfcb-4bde-ba37-3c66ed1ced34.png?X-Amz-Algorithm=AWS4-HMAC-SHA256&X-Amz-Date=20260811T070856Z&X-Amz-SignedHeaders=host&X-Amz-Credential=AKIATS6DFUWO2B3G45CA%2F20260811%2Fap-southeast-2%2Fs3%2Faws4_request&X-Amz-Expires=3600&X-Amz-Signature=6ee7a1381dd626acc44c16e9005bff9db57bde2dba5814401ef437db27c04e0c" alt="" onerror="this.style.display='none';">
      <div class="content">
        <div class="headline">
          <span class="script">Happy</span>
          <span class="bold">Birthday!</span>
        </div>

        <div class="photo-ring">
          <div class="photo">
            <img src="" alt="Aarav Patel" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
            <span class="initials" style="display:none;">AP</span>
          </div>
        </div>

        <div class="name">Aarav Patel</div>
        <div class="class-pill">Grade 5 - A</div>
        <div class="ribbon">Turning 10 today!</div>

        <p class="message">Wishing Aarav a wonderful birthday filled with happiness, success, and lots of smiles. Have an amazing year ahead!</p>

        <div class="divider"><span class="line"></span><span class="heart">&#9829;</span><span class="line"></span></div>

        <div class="stats">
          <div class="stat">
            <div class="icon">&#128197;</div>
            <div class="label">Birthday</div>
            <div class="value">03 August</div>
          </div>
          <div class="stat">
            <div class="icon">&#127874;</div>
            <div class="label">Age</div>
            <div class="value">10 years</div>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
